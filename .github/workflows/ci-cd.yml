name: React CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # ---- INGA THAAN TEST STEP ADD PANNUM ----
      - name: Run Tests
        run: npm test -- --watchAll=false
        # (-- --watchAll=false nu podurathu enna na, GitHub Actions headless environment-la test run aagi appadiye automatic-ah exit aaganum, illana hang aagidum.)

      - name: Build Project
        run: npm run build

      - name: Install Zoho Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Deploy to Zoho Catalyst
        run: catalyst deploy --token ${{ secrets.CATALYST_REFRESH_TOKEN }}